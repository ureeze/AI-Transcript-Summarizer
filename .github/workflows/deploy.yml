name: Deploy

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/ureeze/ai-transcript-summarizer-frontend
  BACKEND_IMAGE: ghcr.io/ureeze/ai-transcript-summarizer-backend

jobs:
  build-and-push:
    name: Build and push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_API_BASE_URL=

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read

    steps:
      - name: Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Update server and restart containers
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR || '/home/ec2-user/apps/AI-Transcript-Summarizer' }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME || github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          APP_CORS_ALLOWED_ORIGIN: ${{ secrets.APP_CORS_ALLOWED_ORIGIN || 'http://localhost' }}
          DEPLOY_FRONTEND_IMAGE: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          DEPLOY_BACKEND_IMAGE: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
        run: |
          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
            "cd '$EC2_APP_DIR' && git fetch origin && git checkout develop && git pull --ff-only origin develop"

          if [ -n "$GHCR_TOKEN" ]; then
            printf '%s\n' "$GHCR_TOKEN" | ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
              "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"
          fi

          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
            "cat > '$EC2_APP_DIR/deploy/.env'" <<EOF
          OPENAI_API_KEY=$OPENAI_API_KEY
          APP_CORS_ALLOWED_ORIGIN=$APP_CORS_ALLOWED_ORIGIN
          FRONTEND_IMAGE=$DEPLOY_FRONTEND_IMAGE
          BACKEND_IMAGE=$DEPLOY_BACKEND_IMAGE
          EOF

          ssh -i ~/.ssh/ec2_key -o StrictHostKeyChecking=accept-new "$EC2_USER@$EC2_HOST" \
            "chmod 600 '$EC2_APP_DIR/deploy/.env' && cd '$EC2_APP_DIR/deploy' && docker compose pull && docker compose up -d --no-build && docker image prune -f"
