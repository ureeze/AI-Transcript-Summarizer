services:
  nginx:
    image: nginx:1.27-alpine
    container_name: ai-transcript-summarizer-nginx
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-ai-transcript-summarizer-frontend:local}
    build:
      context: ../frontend
      args:
        VITE_API_BASE_URL: ""
    container_name: ai-transcript-summarizer-frontend
    networks:
      - app-network
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:-ai-transcript-summarizer-backend:local}
    build:
      context: ../backend
    container_name: ai-transcript-summarizer-backend
    env_file:
      - .env
    environment:
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost}
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
